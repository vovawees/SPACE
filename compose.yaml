# SPACE в Docker или Podman: docker compose up -d   (или podman compose up -d)
# Откройте http://localhost:8787. Данные — в томе space-data.
# Обновить: docker compose up -d --build · журнал: docker compose logs -f
services:
  space:
    build: .
    image: space:latest
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      STORAGE_DIR: /data
      # остальные настройки — как в .env.example, например:
      # SPACE_INVITE_CODE: придумайте-код
      # GITHUB_TOKEN: ghp_...
    volumes:
      - space-data:/data

volumes:
  space-data:
