<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0f12" />
    <meta name="description" content="SPACE — бесконечная доска: заметки, код, файлы, ссылки, умное рисование и совместная работа." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>SPACE</title>
    <script>
      // акцент до первой отрисовки — без вспышки
      try {
        const a = JSON.parse(localStorage.getItem("space:settings") || "{}").accent;
        if (typeof a === "string" && /^[a-z]+$/.test(a) && a !== "orange") document.documentElement.dataset.accent = a;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
